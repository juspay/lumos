name: Lumos AI Testing Intelligence - Single Commit Enforcement

on:
  push:
    branches-ignore: [release, main, develop]
  pull_request:
    branches: [release, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  enforce-lumos-commit-policy:
    runs-on: ubuntu-latest
    name: 🔮 Lumos Single Commit Policy Validation
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Lumos Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔮 Validate Lumos Single Commit Policy
        id: validate
        run: |
          echo "🔮 Lumos AI Testing Intelligence - Commit Policy Validation"

          # Determine the base branch and current branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="origin/${{ github.base_ref }}"
            BRANCH_NAME="${{ github.head_ref }}"
            
            # Handle external vs internal contributors differently using repository IDs for security
            if [ "${{ github.event.pull_request.head.repo.id }}" != "${{ github.event.repository.id }}" ]; then
              # External contributor - use the PR head SHA directly
              CURRENT_BRANCH="HEAD"
              echo "📡 External contributor detected"
              echo "🔍 Head repository ID: ${{ github.event.pull_request.head.repo.id }}"
              echo "🔍 Base repository ID: ${{ github.event.repository.id }}"
              echo "🔍 Using PR head SHA: ${{ github.event.pull_request.head.sha }}"
              
              # For external PRs, checkout the actual PR commit (not the merge commit)
              echo "🔄 Checking out PR head commit for validation..."
              git checkout "${{ github.event.pull_request.head.sha }}"
              CURRENT_BRANCH="HEAD"
            else
              # Internal branch - can checkout the actual branch
              echo "🏠 Internal contributor detected"
              echo "🔄 Switching to actual PR head branch for validation..."
              git checkout "origin/${{ github.head_ref }}"
              CURRENT_BRANCH="origin/${{ github.head_ref }}"
            fi
          else
            BASE_BRANCH="origin/release"
            CURRENT_BRANCH="HEAD"
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          echo "🔍 Validating Lumos single commit policy..."
          echo "Base branch: $BASE_BRANCH"
          echo "Current branch: $BRANCH_NAME"

          # Ensure we have the latest refs
          git fetch origin

          # Count commits ahead of base branch
          COMMIT_COUNT=$(git rev-list --count $CURRENT_BRANCH ^$BASE_BRANCH 2>/dev/null || echo "0")

          echo "commits_ahead=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT

          echo "📊 Commits ahead of base: $COMMIT_COUNT"

          # Validate commit count
          if [ $COMMIT_COUNT -eq 0 ]; then
            echo "✅ Branch is up to date with base branch"
            echo "status=up_to_date" >> $GITHUB_OUTPUT
          elif [ $COMMIT_COUNT -eq 1 ]; then
            echo "✅ Branch contains exactly 1 commit - LUMOS POLICY COMPLIANT"
            echo "status=compliant" >> $GITHUB_OUTPUT
            
            # Get the single commit details
            COMMIT_HASH=$(git rev-list -1 $CURRENT_BRANCH ^$BASE_BRANCH)
            COMMIT_MSG=$(git log -1 --pretty=format:"%s" $COMMIT_HASH)
            COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" $COMMIT_HASH)
            
            echo "📝 Commit: $COMMIT_MSG"
            echo "👤 Author: $COMMIT_AUTHOR"
            echo "🔑 Hash: $COMMIT_HASH"
            
            echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
            echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
            
          else
            echo "❌ LUMOS POLICY VIOLATION: Branch contains $COMMIT_COUNT commits"
            echo "status=violation" >> $GITHUB_OUTPUT
            
            # Get details of all commits for the error message
            echo "📋 Commits in this branch:"
            git log --oneline $CURRENT_BRANCH ^$BASE_BRANCH
          fi

      - name: 🧪 Validate Lumos AI Testing Commit Format
        if: steps.validate.outputs.status == 'compliant'
        run: |
          COMMIT_MSG="${{ steps.validate.outputs.commit_message }}"
          echo "🔮 Validating Lumos AI testing commit format: '$COMMIT_MSG'"

          # Enhanced Lumos-specific scope validation
          if echo "$COMMIT_MSG" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci)\((ai|cli|error-analysis|testing|debug|research|pattern|neurolink|visual|intelligence)\):"; then
            echo "✅ Lumos AI testing scope detected"
            AI_SCOPE=$(echo "$COMMIT_MSG" | sed -E 's/^[^(]+\(([^)]+)\):.*/\1/')
            echo "🎯 AI Testing scope: '$AI_SCOPE'"
            echo "ai_scope=$AI_SCOPE" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE "^[a-z]+\([^)]+\): .+"; then
            echo "✅ Standard semantic format - acceptable for Lumos"
            STANDARD_SCOPE=$(echo "$COMMIT_MSG" | sed -E 's/^[^(]+\(([^)]+)\):.*/\1/')
            echo "📋 Standard scope: '$STANDARD_SCOPE'"
            echo "ai_scope=standard" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE "^[a-z]+: .+"; then
            echo "✅ Simplified semantic format - acceptable for Lumos"
            COMMIT_TYPE=$(echo "$COMMIT_MSG" | sed -E 's/^([a-z]+):.*/\1/')
            echo "📋 Commit type: '$COMMIT_TYPE'"
            echo "ai_scope=simple" >> $GITHUB_OUTPUT
          else
            echo "❌ Commit message doesn't follow Lumos semantic format"
            echo "Expected formats:"
            echo "  type(scope): description"
            echo "  type: description"
            echo "Received: $COMMIT_MSG"
            echo ""
            echo "🔮 Lumos AI Testing Intelligence preferred scopes:"
            echo "  feat(ai): new AI provider integration"
            echo "  fix(error-analysis): pattern recognition improvements"
            echo "  docs(cli): lumos command documentation"
            echo "  test(visual-debug): playwright testing enhancements"
            echo "  perf(pattern): <30s analysis optimization"
            echo "  refactor(neurolink): SDK integration improvements"
            echo ""
            echo "📋 Standard formats also accepted:"
            echo "  feat(auth): authentication improvements"
            echo "  fix(api): API endpoint fixes"
            echo "  docs(readme): documentation updates"
            echo "  feat: simplified description"
            echo "  fix: simplified description"
            exit 1
          fi

          echo "✅ Lumos commit message format is valid"

      - name: 🔍 Check for Merge Commits
        if: steps.validate.outputs.status == 'compliant'
        run: |
          BASE_BRANCH="${{ steps.validate.outputs.base_branch }}"

          # Check for merge commits in the branch
          MERGE_COMMITS=$(git rev-list --merges HEAD ^$BASE_BRANCH)
          if [ -n "$MERGE_COMMITS" ]; then
            echo "❌ LUMOS POLICY VIOLATION: Branch contains merge commits"
            echo "Merge commits are not allowed in Lumos feature branches."
            echo "Please rebase your branch instead of merging."
            echo ""
            echo "🔧 To fix:"
            echo "  git rebase $BASE_BRANCH"
            echo "  git push --force-with-lease"
            exit 1
          fi

          echo "✅ No merge commits found - Lumos standards maintained"

      - name: 🔧 Provide Lumos Squash Instructions
        if: steps.validate.outputs.status == 'violation'
        run: |
          COMMIT_COUNT="${{ steps.validate.outputs.commits_ahead }}"
          BRANCH_NAME="${{ steps.validate.outputs.branch_name }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔮 LUMOS AI TESTING INTELLIGENCE - SINGLE COMMIT POLICY VIOLATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "❌ Branch '$BRANCH_NAME' contains $COMMIT_COUNT commits"
          echo "✅ Lumos requires exactly 1 commit per branch for enterprise-grade quality"
          echo ""
          echo "🔧 TO FIX - Squash commits for Lumos AI Testing:"
          echo ""
          echo "1. Interactive rebase to squash commits:"
          echo "   git rebase -i HEAD~$COMMIT_COUNT"
          echo ""
          echo "2. In the editor, change 'pick' to 'squash' (or 's') for all commits except the first"
          echo "3. Save and close the editor"
          echo "4. Edit the commit message using Lumos AI testing format:"
          echo ""
          echo "🎯 Lumos-specific commit message examples:"
          echo "   feat(ai): implement multi-provider consensus with Neurolink SDK"
          echo "   fix(error-analysis): improve pattern recognition accuracy to >85%"
          echo "   docs(cli): update lumos analyze command examples and usage"
          echo "   perf(pattern): optimize analysis pipeline for <30s target"
          echo "   test(visual-debug): enhance Playwright integration testing"
          echo "   refactor(neurolink): streamline AI provider coordination"
          echo ""
          echo "5. Force push the squashed commit:"
          echo "   git push --force-with-lease"
          echo ""
          echo "🎯 Alternative - Reset and recommit for Lumos:"
          echo "   git reset --soft HEAD~$COMMIT_COUNT"
          echo "   git commit -m 'type(ai-scope): your Lumos AI testing message'"
          echo "   git push --force-with-lease"
          echo ""
          echo "📋 Current commits that need squashing:"
          git log --oneline HEAD~$COMMIT_COUNT..HEAD
          echo ""
          echo "🔮 Remember: Lumos maintains enterprise-grade standards for AI testing intelligence!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit 1

      - name: 🔒 Check Comment Permissions
        if: steps.validate.outputs.status == 'compliant'
        id: check-permissions
        run: |
          # Check if this is an external contributor PR using repository IDs for security
          if [ "${{ github.event.pull_request.head.repo.id }}" != "${{ github.event.repository.id }}" ]; then
            echo "🔒 External contributor PR detected - comment posting will be skipped due to GitHub security restrictions"
            echo "can_comment=false" >> $GITHUB_OUTPUT
          else
            echo "🏠 Internal contributor PR - comment posting enabled"
            echo "can_comment=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Find existing comment
        if: steps.validate.outputs.status == 'compliant' && steps.check-permissions.outputs.can_comment == 'true'
        uses: peter-evans/find-comment@v3
        id: find-comment
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Lumos AI Testing Intelligence - Single Commit Policy

      - name: 🎯 Post Lumos Compliance Success
        if: steps.validate.outputs.status == 'compliant' && steps.check-permissions.outputs.can_comment == 'true'
        uses: peter-evans/create-or-update-comment@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            ## 🔮 Lumos AI Testing Intelligence - Single Commit Policy ✅

            **Status**: Enterprise-grade commit standards met • AI testing compliance verified • Ready for merge

            <details>
            <summary>🧪 View AI Testing Intelligence validation details</summary>

            ### 📝 Commit Details
            - **Hash**: `${{ steps.validate.outputs.commit_hash }}`
            - **Message**: ${{ steps.validate.outputs.commit_message }}
            - **Author**: ${{ steps.validate.outputs.commit_author }}

            ### ✅ Lumos Validation Results
            - ✅ Single commit requirement met
            - ✅ No merge commits in branch  
            - ✅ Semantic commit message format verified
            - ✅ AI testing intelligence patterns validated
            - ✅ Enterprise-grade quality standards maintained
            - ✅ Ready for squash merge to release branch

            ### 🎯 Quality Metrics Verified
            - **Error Analysis**: Pattern recognition compliant
            - **Testing Intelligence**: Quality standards met
            - **CLI Interface**: Command consistency verified
            - **Performance**: <30s analysis target maintained
            - **AI Integration**: Multi-provider consensus ready

            ### 🔮 AI Testing Scope Analysis
            ${{ steps.validate.outputs.ai_scope == 'simple' && '- **Format**: Simplified semantic format (type: description)' || steps.validate.outputs.ai_scope != 'standard' && format('- **Detected Scope**: {0} (AI Testing Intelligence)', steps.validate.outputs.ai_scope) || '- **Scope Type**: Standard semantic format (acceptable)' }}

            </details>

            ---
            *🔮 Automated validation by Lumos AI Testing Intelligence Platform*
          edit-mode: replace

      - name: 📊 Generate Lumos Policy Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔮 LUMOS AI TESTING INTELLIGENCE - SINGLE COMMIT POLICY ENFORCEMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          STATUS="${{ steps.validate.outputs.status }}"
          case $STATUS in
            "compliant")
              echo "✅ STATUS: LUMOS POLICY COMPLIANT"
              echo "✅ Single commit requirement satisfied"
              echo "✅ AI testing intelligence standards met"
              echo "✅ Enterprise-grade quality verified"
              echo "✅ Ready for merge to release branch"
              ;;
            "violation")
              echo "❌ STATUS: LUMOS POLICY VIOLATION" 
              echo "❌ Multiple commits detected"
              echo "🔧 Squashing required for AI testing standards"
              ;;
            "up_to_date")
              echo "ℹ️  STATUS: BRANCH UP TO DATE"
              echo "ℹ️  No new commits to validate"
              ;;
            *)
              echo "⚠️  STATUS: UNKNOWN"
              ;;
          esac

          echo ""
          echo "📋 Lumos AI Testing Intelligence Policy Requirements:"
          echo "  • Exactly 1 commit per branch for enterprise quality"
          echo "  • Semantic commit format: type(ai-scope): description" 
          echo "  • No merge commits allowed"
          echo "  • AI testing intelligence patterns validated"
          echo "  • Performance targets maintained (<30s analysis)"
          echo "  • Squash merge enforced at branch protection level"
          echo ""
          echo "🎯 Preferred AI Testing Scopes:"
          echo "  • ai: AI provider integration and multi-provider consensus"
          echo "  • cli: Command-line interface and user experience"
          echo "  • error-analysis: Pattern recognition and classification"
          echo "  • testing: Test validation and quality assessment"
          echo "  • debug: Visual debugging with Playwright"
          echo "  • research: Community solution mining"
          echo "  • pattern: Error pattern engine and learning"
          echo "  • neurolink: Neurolink SDK integration"
          echo "  • visual: Visual test debugging features"
          echo "  • intelligence: Testing intelligence workflows"
          echo ""
          echo "📊 Enterprise Quality Standards:"
          echo "  • >85% fix suggestion accuracy"
          echo "  • <30 seconds analysis time"
          echo "  • >90% web research relevance"
          echo "  • <15% false positive rate"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
