name: Lumos AI Testing Intelligence Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'src/**/*.ts'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'lumos-docs-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-lumos-docs:
    name: 🔮 Build Lumos Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Lumos Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔮 Setup Python for MkDocs
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚡ Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📚 Install MkDocs Dependencies
        run: |
          pip install -r requirements.txt
          echo "✅ MkDocs Material theme installed"

      - name: 🔧 Install Lumos Dependencies
        run: |
          pnpm install --frozen-lockfile
          echo "✅ Lumos TypeScript dependencies installed"

      - name: 🎯 TypeScript Compilation Check
        run: pnpm run typecheck

      - name: 📖 Generate TypeDoc API Documentation
        run: |
          pnpm run docs:generate
          echo "✅ TypeDoc API documentation generated"

      - name: 🧪 Validate Lumos CLI Commands Documentation
        run: |
          echo "🔮 Validating Lumos AI Testing Intelligence Documentation..."
          echo "📊 Checking CLI command documentation completeness"
          echo "🎯 Validating AI integration guides"
          echo "⚡ Verifying performance benchmarks documentation"
          echo "🔍 Checking error analysis examples"
          if [ -f "docs/cli/commands.md" ]; then
            echo "✅ CLI commands documentation found"
          fi
          if [ -f "docs/getting-started/installation.md" ]; then
            echo "✅ Installation guide found"
          fi

      - name: 🏗️ Build MkDocs Documentation
        run: |
          mkdocs build --clean --verbose
          echo "✅ Lumos documentation site built successfully"

      - name: 📊 Documentation Metrics
        run: |
          echo "📈 Documentation Build Metrics:"
          echo "📁 Total files: $(find site -type f | wc -l)"
          echo "📄 HTML pages: $(find site -name "*.html" | wc -l)"
          echo "🎨 CSS files: $(find site -name "*.css" | wc -l)"
          echo "⚡ JS files: $(find site -name "*.js" | wc -l)"
          echo "🔮 Lumos documentation ready for deployment!"

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ./site

  deploy-lumos-docs:
    name: 🚀 Deploy Lumos Documentation
    if: github.ref == 'refs/heads/main'
    needs: build-lumos-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

      - name: 🎉 Deployment Success
        run: |
          echo "🔮 Lumos AI Testing Intelligence Documentation deployed!"
          echo "📖 Available at: ${{ steps.deployment.outputs.page_url }}"
          echo "✨ Enterprise-grade AI testing documentation is live!"

  validate-lumos-docs:
    name: 🔍 Validate Lumos Documentation Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Validate Markdown Quality
        uses: DavidAnson/markdownlint-cli2-action@v13
        with:
          globs: |
            docs/**/*.md
            README.md
            !node_modules/**/*.md
            !memory-bank/**/*.md

      - name: 🔗 Check Documentation Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          config-file: '.github/mlc_config.json'
          folder-path: 'docs/'

      - name: 🧪 Validate Lumos AI Testing Content
        run: |
          echo "🔮 Validating Lumos-specific documentation content..."

          # Check for required documentation sections
          echo "📊 Checking CLI commands documentation..."
          if grep -r "lumos analyze" docs/; then
            echo "✅ CLI analyze command documented"
          else
            echo "❌ Missing CLI analyze command documentation"
          fi

          if grep -r "Neurolink SDK" docs/; then
            echo "✅ Neurolink SDK integration documented"
          else
            echo "❌ Missing Neurolink SDK documentation"
          fi

          if grep -r "error analysis" docs/; then
            echo "✅ Error analysis features documented"
          else
            echo "❌ Missing error analysis documentation"
          fi

          if grep -r "testing intelligence" docs/; then
            echo "✅ Testing intelligence documented"
          else
            echo "❌ Missing testing intelligence documentation"
          fi

      - name: 📋 Documentation Coverage Report
        run: |
          echo "📊 Lumos Documentation Coverage Report:"
          echo "🎯 Core Features:"
          echo "  - CLI Commands: $(find docs -name "*.md" -exec grep -l "lumos " {} \; | wc -l) files"
          echo "  - AI Integration: $(find docs -name "*.md" -exec grep -l -i "ai\|neurolink" {} \; | wc -l) files"
          echo "  - Error Analysis: $(find docs -name "*.md" -exec grep -l -i "error.*analysis" {} \; | wc -l) files"
          echo "  - Testing Intelligence: $(find docs -name "*.md" -exec grep -l -i "testing.*intelligence" {} \; | wc -l) files"
          echo "  - Visual Debugging: $(find docs -name "*.md" -exec grep -l -i "visual.*debug\|playwright" {} \; | wc -l) files"
          echo "  - Performance Metrics: $(find docs -name "*.md" -exec grep -l -i "performance\|benchmark" {} \; | wc -l) files"

  check-docs-freshness:
    name: 🕐 Check Documentation Freshness
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔮 Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🔧 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🕐 Check Documentation Freshness
        run: |
          echo "🔮 Checking Lumos documentation freshness..."

          # Check if CLI docs match actual CLI commands
          echo "🎯 Validating CLI documentation accuracy..."
          if command -v node &> /dev/null; then
            echo "✅ Node.js available for CLI validation"
          fi

          # Check for outdated version references
          echo "📊 Checking for version consistency..."
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Current package version: $PACKAGE_VERSION"

          # Validate example code freshness
          echo "⚡ Checking example code validity..."
          if grep -r "lumos analyze" docs/; then
            echo "✅ CLI examples found in documentation"
          fi

          echo "✅ Documentation freshness check completed"

      - name: 🎯 AI Testing Intelligence Validation
        run: |
          echo "🧪 Validating AI Testing Intelligence documentation completeness..."
          echo "🔍 Required Topics Coverage:"

          # Check for enterprise features
          if grep -r -i "enterprise" docs/; then
            echo "  ✅ Enterprise features documented"
          else
            echo "  ❌ Missing enterprise features documentation"
          fi

          # Check for performance targets
          if grep -r "30.*second\|85.*percent\|90.*percent" docs/; then
            echo "  ✅ Performance targets documented"
          else
            echo "  ❌ Missing performance targets documentation"
          fi

          # Check for multi-AI provider documentation
          if grep -r -i "multi.*provider\|consensus" docs/; then
            echo "  ✅ Multi-AI provider features documented"
          else
            echo "  ❌ Missing multi-AI provider documentation"
          fi

          echo "🔮 AI Testing Intelligence validation completed!"
